<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><title>Verify your Bakaiti email</title></head>
  <body style="margin:0;background:#f5f3ff;color:#211737;font-family:Arial,sans-serif;padding:32px 16px;">
    <main style="max-width:480px;margin:auto;background:#fff;border-radius:16px;padding:32px;">
      <h1 style="font-size:26px;margin:0 0 20px;">Welcome to Bakaiti</h1>
      <p>Enter this code in Bakaiti to verify your email and finish creating your account:</p>
      <p style="font-size:36px;font-weight:bold;letter-spacing:8px;color:#7136ce;">{{ .Token }}</p>
      <p>This code expires soon. If it has expired, request a new code in the app.</p>
      <p>Keep the code private. If you did not request an account, you can ignore this email.</p>
    </main>
  </body>
</html>
